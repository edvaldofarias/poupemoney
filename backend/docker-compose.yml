services:

  core-webapi:
    build: 
      context: .
      dockerfile: ./src/PoupeMoney.Core.WebApi/Dockerfile
    user: app
    container_name: core-webapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - '5001:8080'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/application"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
        - core-network
    depends_on:
      mssql:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    ports:
      - '1433:1433'
    environment:
      - MSSQL_SA_PASSWORD=A6h4BwY6cgN7
      - ACCEPT_EULA=Y
    restart: unless-stopped
    networks:
        - core-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  core-network:
    driver: bridge
